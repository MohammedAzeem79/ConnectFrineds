<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News feed | ConnecFriend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-lg-flex">
  <header id="shell" class="cf-shell"></header>
  <main class="cf-main flex-grow-1 p-3 p-lg-4">
    <div class="row g-4">
      <div class="col-xl-8">
        <h1 class="h3 fw-bold mb-1">News feed</h1>
        <p class="text-secondary" id="welcome"></p>

        <form id="postForm" class="card mb-4" novalidate>
          <div class="card-body">
            <label for="postText" class="form-label fw-semibold">Share some news</label>
            <textarea id="postText" class="form-control" rows="3" maxlength="280" placeholder="What is happening with you?"></textarea>
            <div class="invalid-feedback" id="postError"></div>
            <div class="d-flex justify-content-end small text-secondary mt-1"><span id="charCount">0</span>/280</div>

            <fieldset class="mt-2">
              <legend class="form-label fw-semibold fs-6 mb-1">Who can see it?</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="aud" id="audAll" value="all" checked>
                <label class="form-check-label" for="audAll">All friends</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="aud" id="audSome" value="some">
                <label class="form-check-label" for="audSome">Some friends</label>
              </div>
              <div id="friendPicker" class="d-none mt-2 p-2 border rounded bg-light row row-cols-1 row-cols-sm-2 g-1 mx-0"></div>
            </fieldset>
          </div>
          <div class="card-footer bg-white d-flex justify-content-end">
            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Share news</button>
          </div>
        </form>

        <div id="feed"></div>
      </div>

      <aside class="col-xl-4">
        <div class="card position-sticky" style="top:1rem">
          <div class="card-header bg-white fw-bold">Friends by latest login</div>
          <ul class="list-group list-group-flush" id="friendOrder"></ul>
        </div>
      </aside>
    </div>
  </main>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
